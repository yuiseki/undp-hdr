checked:
  note: scripts/02_verify.py, with Python's csv module and DuckDB, before upload
  items:
    - every raw file against MANIFEST.json (size and sha256); every xlsx a sound zip
    - CSV rows counted with the csv module in Windows-1252 (206)
    - wide Parquet has the CSV's rows and its 1,112 column names in order
    - every column of the type its name gives
    - all 229,072 cells of the wide Parquet equal the CSV's, one by one
    - long Parquet has one row per filled value cell (200,004) with the same (iso3, indicator, year) to value mapping, country and region
    - a DuckDB without extension autoloading opens both files
    - no bloom filters

modifications:
  raw: none. HDRO's files, byte for byte.
  parquet:
    - the CSV decoded from Windows-1252, text written as UTF-8
    - columns typed by name; a value that does not fit stops the build; empty cells NULL
    - long table derived from column names <indicator>_<year>, empty cells left out, sorted by indicator, iso3, year
    - written with zstd, without bloom filters
  not_converted: the metadata workbook, the statistical annex workbooks and the MPI workbook (report-style layouts)
