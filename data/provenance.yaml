# Where this data comes from and what was done to it.

source:
  name: Human Development Report statistics (HDI and the composite indices)
  publisher: Human Development Report Office (HDRO), United Nations Development Programme (UNDP)
  mpi_coproducer: Oxford Poverty and Human Development Initiative (OPHI), University of Oxford
  downloads: https://hdr.undp.org/data-center/documentation-and-downloads
  licence:
    applied: CC BY 3.0 IGO (https://hdr.undp.org/terms-use, read 2026-10-04)
    legal_code: https://creativecommons.org/licenses/by/3.0/igo/legalcode
    card: "license: other, license_name: cc-by-3.0-igo"
    attribution_required: true
    indicate_changes: true
    no_endorsement: true
    share_alike: false
    note: |
      The report PDF says "All rights reserved" and is not included. The data
      files carry no licence text; the site's terms apply.
  comparability: |
    HDRO recalculates the entire series of HDI values and ranks every year,
    so values and ranks from different reports cannot be compared directly.
  citation: >-
    Source: UNDP (United Nations Development Programme). 2025. Human
    Development Report 2025 - A matter of choice: People and possibilities in
    the age of AI. New York.

